name: Replace Manga Hub Brookhaven
on:
  push:
    branches: [main]
    paths:
      - ".mangahub_replace/go"
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace file
        shell: bash
        run: |
          set -euo pipefail
          cat .mangahub_replace/chunk_* | base64 -d | bzip2 -d > "manga hub brookhaven"
          rm -rf .mangahub_replace
          rm -f .github/workflows/replace-mangahub.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace manga hub brookhaven content"
          git push origin HEAD:main
